spring:
  config:
    import: application-db.yml

  jpa:
    show-sql: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# OAuth Configuration
google:
  client-id: ${GOOGLE_CLIENT_ID}

apple:
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  client-id: ${APPLE_CLIENT_ID}

# Swagger disabled in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logging
logging:
  level:
    com.ss_shot: INFO
    org.hibernate.SQL: WARN
